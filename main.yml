name: Aylık filtre hatırlatma maili
on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Hatırlatma maillerini gönder
        run: |
          curl -fsS -X POST "${{ secrets.SITE_URL }}/api/email/send-filter-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"   
