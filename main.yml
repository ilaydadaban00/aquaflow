name: Aylık filtre hatırlatma maili
on:
  schedule:
    - cron: '0 7 1 * *'   # Her ayın 1'i, 10:00 (Türkiye saati)
  workflow_dispatch:        # Elle test: Actions > Run workflow
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Hatırlatma maillerini gönder
        run: |
          curl -sS --max-time 60 -w "\nHTTP %{http_code}\n" -X POST \
            "${{ secrets.SITE_URL }}/api/email/send-filter-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -o resp.txt -w "%{http_code}" > code.txt
          cat resp.txt; echo; echo "HTTP $(cat code.txt)"
          test "$(cat code.txt)" = "200"
